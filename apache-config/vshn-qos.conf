# mod_qos: quality-of-service / DoS controls (https://mod-qos.sourceforge.net/).
# Loaded but INERT by default. Activate by setting MOD_QOS_ENABLED=on AND
# providing a rules file at conf/extra/qos-rules-on.conf (bind-mount/Secret).
# This file is auto-included at server scope via the existing
# "Include conf/extra/vshn-*.conf" in httpd-modsecurity.conf.
<IfModule !qos_module>
  LoadModule qos_module modules/mod_qos.so
</IfModule>
IncludeOptional conf/extra/qos-rules-${MOD_QOS_ENABLED}.conf