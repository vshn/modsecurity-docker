# mod_qos GeoIP country-block + IPv6-block test rules (server scope).
# Bind-mounted as qos-rules-on.conf; loaded via vshn-qos.conf when
# MOD_QOS_ENABLED=on. The production image ships no rules.
#
# GeoIP CSV (3-field: begin IPv4 number, end IPv4 number, country code).
QS_ClientGeoCountryDB /usr/local/apache2/conf/extra/geo/GeoIPCountryWhois.csv

# Resolve the country from a test header so one run can exercise both a
# blocked and an allowed country. Falls back to the real client IP when
# the header is absent.
QS_ClientGeoIpFromHeader X-Geo-Test-IP

# mod_remoteip is already loaded in the base image; configure it so
# X-Forwarded-For overrides Remote_Addr — lets the IPv6-block rule be
# exercised over the IPv4 docker network (real IPv6 needs daemon config).
RemoteIPHeader X-Forwarded-For
RemoteIPTrustedProxy 172.16.0.0/12

# Block-listed countries -> mark.
SetEnvIf QS_Country ^(PV|LO)$ QS_BlockCountry

# IPv6 source (Remote_Addr contains ':') -> mark. mod_qos geo is IPv4-only,
# so IPv6 clients get no country; block them explicitly here.
SetEnvIf Remote_Addr : QS_BlockIPv6

<Location />
  QS_DenyEvent +cblock deny QS_BlockCountry
  QS_DenyEvent +ipv6   deny QS_BlockIPv6
</Location>