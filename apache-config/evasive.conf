<IfModule mod_evasive.c>
    DOSEnabled        ${MOD_EVASIVE_ENABLED}
    DOSHashTableSize  3079
    DOSPageCount      100
    DOSSiteCount      1000
    DOSPageInterval   1
    DOSSiteInterval   1
    DOSBlockingPeriod 10
    DOSHTTPStatus     403
    DOSLogDir         /usr/local/apache2/logs
</IfModule>