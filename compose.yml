name: modsecurity

services:
  waf:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      BACKEND: "http://backend:8080"

    # Simulate OpenShift by using a random UID and GID, as well as GID 0
    user: "1001140000:1001140000"
    group_add:
      - root

    # Simulate an emptyDir volume. Required for apache to write its PID file
    tmpfs:
      - "/usr/local/apache2/logs:mode=770"

    develop:
      watch:
        - action: rebuild
          path: .

  backend:
    image: "docker.io/sharat87/httpbun:latest@sha256:27730b0fa6134d96e43de5108f767d33a31a5fa97c81aa5d517ef5e4aafb4f7b"
    environment:
      HTTPBUN_BIND: "0.0.0.0:8080"
